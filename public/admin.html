<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Panel de Invitados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:24px;background:#f7f7f7;}
    h1{margin:0 0 16px;text-align:center}
    .toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:0 0 12px}
    .search{flex:1}
    input[type="search"]{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid #ddd;padding:8px;vertical-align:top}
    th{background:#fafafa;text-align:left;position:sticky;top:0;z-index:1}
    .ok{color:green;font-weight:700}
    .no{color:#b00020;font-weight:700}
    .muted{color:#666}
    .status{margin:8px 0 0;color:#666}
    .add-btn{padding:10px 16px;background:#8b9b6a;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px}
    .add-btn:hover{background:#7a8a59}
    .logout-btn{padding:10px 16px;background:#666;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px}
    .logout-btn:hover{background:#555}
    .excel-btn{padding:10px 16px;background:#217346;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px}
    .excel-btn:hover{background:#185c37}
    .upload-btn{padding:10px 16px;background:#2b5797;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px}
    .upload-btn:hover{background:#1e4277}
    #fileInput{display:none}
    .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}
    .modal-content{background:#fff;margin:50px auto;padding:24px;border-radius:8px;max-width:500px;box-shadow:0 4px 8px rgba(0,0,0,0.2)}
    .modal-title{font-size:20px;font-weight:600;margin-bottom:16px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;font-weight:500}
    .form-group input{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
    .modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
    .modal-btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
    .modal-btn-primary{background:#8b9b6a;color:white}
    .modal-btn-primary:hover{background:#7a8a59}
    .modal-btn-secondary{background:#ddd;color:#333}
    .modal-btn-secondary:hover{background:#ccc}
  </style>
</head>
<body>
  <h1>Lista de Invitados</h1>
  <div class="toolbar">
    <div class="search"><input id="q" type="search" placeholder="Buscar por nombre, número o mensaje..."></div>
    <button class="add-btn" id="addGuestBtn">+ Agregar Invitado</button>
    <button class="excel-btn" id="downloadBtn">📄 Descargar Excel</button>
    <button class="upload-btn" id="uploadBtn">📂 Subir Excel</button>
    <input type="file" id="fileInput" accept=".xls,.xlsx">
    <button class="logout-btn" id="logoutBtn">🚪 Cerrar Sesión</button>
    <div class="status" id="status"></div>
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Número</th>
          <th>Confirmación</th>
          <th>Boletos</th>
          <th>Confirmados</th>
          <th>Mensaje</th>
          <th>RSVP</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Modal para agregar invitado -->
  <div id="addGuestModal" class="modal">
    <div class="modal-content">
      <h2 class="modal-title">Agregar Nuevo Invitado</h2>
      <form id="addGuestForm">
        <div class="form-group">
          <label for="guestName">Nombre *</label>
          <input type="text" id="guestName" required>
        </div>
        <div class="form-group">
          <label for="guestPhone">Número de Teléfono</label>
          <input type="text" id="guestPhone" placeholder="Ej: 523331112233">
        </div>
        <div class="form-group">
            <label for="guestTickets">Boletos</label>
          <input type="number" id="guestTickets" min="0" value="1">
        </div>
        <div class="modal-buttons">
          <button type="button" class="modal-btn modal-btn-secondary" id="cancelBtn">Cancelar</button>
          <button type="submit" class="modal-btn modal-btn-primary">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const tbody = document.getElementById('tbody');
    const statusEl = document.getElementById('status');
    const q = document.getElementById('q');
    let data = [];

    function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function render(rows){
      const term = q.value.trim().toLowerCase();
      const filtered = term ? rows.filter(r => {
        return (r.Nombre||'').toLowerCase().includes(term) ||
               (r.Telefono||'').toLowerCase().includes(term) ||
               (r.Mensaje||'').toLowerCase().includes(term);
      }) : rows;

      tbody.innerHTML = filtered.map(r => {
        const cls = r.Confirmacion === 'Asistirá' ? 'ok' : (r.Confirmacion === 'No asistirá' ? 'no' : 'muted');
        return `<tr>
          <td>${esc(r.Nombre)}</td>
          <td>${esc(r.Telefono)}</td>
          <td class="${cls}">${esc(r.Confirmacion)}</td>
          <td>${esc(r.Boletos)}</td>
          <td>${esc(r.Confirmados)}</td>
          <td>${esc(r.Mensaje)}</td>
          <td><span class="muted">${esc(r.RSVP_At)}</span></td>
        </tr>`;
      }).join('');

      statusEl.textContent = `${filtered.length} de ${rows.length} registros`;
    }

    async function load(){
      statusEl.textContent = 'Cargando...';
      try{
        const r = await fetch('/api/admin/rows');
        const j = await r.json();
        if(!r.ok || j.ok === false) throw new Error(j.error || 'Error cargando datos');
        data = j.rows || [];
        render(data);
        statusEl.textContent = `${data.length} registros`;
      }catch(e){
        console.error(e);
        statusEl.textContent = 'Error al cargar datos';
      }
    }

    q.addEventListener('input', () => render(data));
    load();

    // Logout functionality
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', async () => {
      if (!confirm('¿Seguro que quieres cerrar sesión?')) return;
      try {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (err) {
        console.error('Error al cerrar sesión:', err);
        alert('Error al cerrar sesión');
      }
    });

    // Excel download functionality
    const downloadBtn = document.getElementById('downloadBtn');
    downloadBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Descargando Excel...';
        const response = await fetch('/api/admin/download-excel');
        
        if (!response.ok) {
          // Verificar si es una redirección a login
          if (response.redirected || response.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('Error al descargar el archivo');
        }
        
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'invitados.xls';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        statusEl.textContent = 'Excel descargado exitosamente';
        setTimeout(() => statusEl.textContent = `${data.length} registros`, 2000);
      } catch (err) {
        console.error('Error al descargar:', err);
        alert('Error al descargar Excel: ' + err.message);
        statusEl.textContent = 'Error al descargar';
      }
    });

    // Excel upload functionality
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    
    uploadBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.name.match(/\.(xls|xlsx)$/i)) {
        alert('Por favor selecciona un archivo Excel (.xls o .xlsx)');
        fileInput.value = '';
        return;
      }

      if (!confirm('¿Estás seguro de que quieres reemplazar el archivo Excel actual? Se creará un backup automático.')) {
        fileInput.value = '';
        return;
      }

      try {
        statusEl.textContent = 'Subiendo Excel...';
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch('/api/admin/upload-excel', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        
        if (!response.ok || result.ok === false) {
          throw new Error(result.error || 'Error al subir archivo');
        }

        alert('Excel actualizado exitosamente. Se creó un backup del archivo anterior.');
        fileInput.value = '';
        await load(); // Recargar datos
      } catch (err) {
        console.error('Error al subir:', err);
        alert('Error al subir Excel: ' + err.message);
        statusEl.textContent = 'Error al subir';
        fileInput.value = '';
      }
    });

    // Modal handling
    const modal = document.getElementById('addGuestModal');
    const addGuestBtn = document.getElementById('addGuestBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const addGuestForm = document.getElementById('addGuestForm');

    addGuestBtn.addEventListener('click', () => {
      modal.style.display = 'block';
    });

    cancelBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      addGuestForm.reset();
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        addGuestForm.reset();
      }
    });

    addGuestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('guestName').value.trim();
      const telefono = document.getElementById('guestPhone').value.trim();
      const boletos = document.getElementById('guestTickets').value;

      if (!nombre) {
        alert('Por favor ingresa un nombre');
        return;
      }

      statusEl.textContent = 'Agregando invitado...';
      try {
        const r = await fetch('/api/admin/add-guest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, telefono, boletos: parseInt(boletos) || 1 })
        });
        const j = await r.json();
        if (!r.ok || j.ok === false) throw new Error(j.error || 'Error al agregar invitado');
        
        modal.style.display = 'none';
        addGuestForm.reset();
        await load();
        alert('Invitado agregado exitosamente');
      } catch (err) {
        console.error(err);
        alert('Error al agregar invitado: ' + err.message);
        statusEl.textContent = 'Error al agregar invitado';
      }
    });
  </script>
</body>
</html>
